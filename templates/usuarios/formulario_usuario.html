{% extends 'base.html' %}

{% block title %}
    {% if usuario %}Editar Usuario{% else %}Nuevo Usuario{% endif %} - UNMO
{% endblock %}

{% block content %}
<div class="container d-flex justify-content-center">
    <div class="card shadow mt-4" style="width: 50%;">
        <div class="card-header bg-dark text-white">
            <h4 class="mb-0">
                {% if usuario %}Editar Usuario (ID: {{ usuario.id_usuario }}){% else %}Agregar Nuevo Usuario a MySQL{% endif %}
            </h4>
        </div>
        <div class="card-body">
            <form method="POST">
                
                <div class="mb-3">
                    <label class="form-label">Nombre Completo</label>
                    <input type="text" class="form-control" name="nombre" 
                           value="{% if usuario %}{{ usuario.nombre }}{% endif %}" required
                           placeholder="Ej. Cabo Juan Pérez">
                </div>

                <div class="mb-3">
                    <label class="form-label">Correo Electrónico (Mail)</label>
                    <input type="email" class="form-control" name="mail" 
                           value="{% if usuario %}{{ usuario.mail }}{% endif %}" required
                           placeholder="juan.perez@policia.gob.ec">
                </div>

                <div class="mb-3">
                    <label class="form-label">Contraseña</label>
                    <input type="text" class="form-control" name="password" 
                           placeholder="{% if usuario %}Dejar en blanco para mantener la actual{% else %}Escriba una contraseña{% endif %}"
                           {% if not usuario %}required{% endif %}>
                </div>

                <div class="d-flex justify-content-between">
                    <a href="{{ url_for('usuarios') }}" class="btn btn-secondary">Cancelar y Volver</a>
                    <button type="submit" class="btn btn-success">
                        {% if usuario %}Guardar Cambios{% else %}Registrar Usuario{% endif %}
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
