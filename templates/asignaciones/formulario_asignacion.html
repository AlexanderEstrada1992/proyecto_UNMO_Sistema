{% extends "base.html" %}

{% block title %}Formulario Asignación - UNMO{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow">
                <div class="card-header bg-primary text-white">
                    <h3 class="card-title mb-0">{{ 'Editar' if asignacion else 'Nueva' }} Asignación</h3>
                </div>
                <div class="card-body">
                    {% if errores %}
                    <div class="alert alert-danger">
                        <ul class="mb-0">
                            {% for e in errores %}
                            <li>{{ e }}</li>
                            {% endfor %}
                        </ul>
                    </div>
                    {% endif %}
                    
                    <form action="{{ url_for('editar_asignacion', id_asignacion=asignacion.id_asignacion) if asignacion else url_for('agregar_asignacion') }}" method="POST">
                        
                        <div class="mb-3">
                            <label for="id_equipo" class="form-label">Equipo Táctico</label>
                            <select class="form-select" id="id_equipo" name="id_equipo" required>
                                <option value="">Seleccione un Equipo...</option>
                                {% for eq in equipos %}
                                <option value="{{ eq.id_equipo }}" {% if asignacion and asignacion.id_equipo == eq.id_equipo %}selected{% endif %}>
                                    {{ eq.tipo }} ({{ eq.id_equipo }})
                                </option>
                                {% endfor %}
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="id_usuario" class="form-label">Usuario Asignado</label>
                            <select class="form-select" id="id_usuario" name="id_usuario" required>
                                <option value="">Seleccione un Usuario...</option>
                                {% for u in usuarios %}
                                <option value="{{ u.id_usuario }}" {% if asignacion and asignacion.id_usuario == u.id_usuario %}selected{% endif %}>
                                    {{ u.nombre }} ({{ u.mail }})
                                </option>
                                {% endfor %}
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="fecha_asignacion" class="form-label">Fecha de Asignación</label>
                            <input type="date" class="form-control" id="fecha_asignacion" name="fecha_asignacion" 
                                   value="{{ asignacion.fecha_asignacion if asignacion else '' }}" required>
                        </div>

                        <div class="mb-3">
                            <label for="observaciones" class="form-label">Observaciones</label>
                            <textarea class="form-control" id="observaciones" name="observaciones" rows="3">{{ asignacion.observaciones if asignacion else '' }}</textarea>
                        </div>

                        <div class="d-flex justify-content-between">
                            <a href="{{ url_for('asignaciones') }}" class="btn btn-secondary">Cancelar</a>
                            <button type="submit" class="btn btn-primary"><i class="fa fa-save"></i> Guardar Asignación</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
